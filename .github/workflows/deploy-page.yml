# The paste-and-preview page, deployed to Cloudflare Pages (project `studio-kinds`,
# https://studio-kinds.pages.dev) on every push to master and on every release tag.
#
# Needs two repository secrets: CLOUDFLARE_ACCOUNT_ID, and CLOUDFLARE_API_TOKEN — an API token with
# the permission Account › Cloudflare Pages › Edit (the "Edit Cloudflare Workers" template works).
name: Deploy the page

on:
  push:
    branches: [master]
    tags: ["studio-v*"]
  workflow_dispatch:

concurrency:
  group: deploy-page
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the page
        run: pnpm page:build

      # wrangler from the npm cache, run at the workspace root: the page's own package.json names
      # workspace dependencies npm cannot read, so nothing is installed into apps/page.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy apps/page/dist --project-name studio-kinds --branch master --commit-dirty=true
