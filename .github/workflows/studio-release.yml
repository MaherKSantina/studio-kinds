# A Studio release, built on a Windows runner and attached to a GitHub Release:
#   Studio-Setup-<v>.exe        the desktop app (installer)
#   studio-vscode-<v>.vsix      the VS Code extension
#   studio-cli-<v>.tgz          the `studio-check` command (npm install -g)
#   studio-files-skill.zip      the studio-files skill for other surfaces (unzip into ~/.claude/skills)
#   install-studio.ps1          installs all four on a PC (needs code and npm on the PATH)
#   SHA256SUMS                  the digest of every file above; the installer verifies each download against it
#
# Every file is built here, on a GitHub-hosted runner, from the tag's own source, and carries a build
# provenance attestation (actions/attest-build-provenance) — `gh attestation verify <file> --repo
# MaherKSantina/studio-kinds` proves a download came from this workflow at this commit.
#
#   git tag studio-v0.2.0 && git push origin studio-v0.2.0
#
# The tag's version is stamped on the packages. "Run workflow" on the Actions tab builds the same
# without a release (the files land in the run's artifacts); a version typed there is stamped too.
name: Studio release

on:
  push:
    tags: ["studio-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp (e.g. 0.2.0); empty keeps the package.json versions"
        required: false
        default: ""

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Stamp the version
        if: startsWith(github.ref, 'refs/tags/studio-v') || inputs.version != ''
        shell: bash
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then V="${GITHUB_REF_NAME#studio-v}"; fi
          echo "version $V"
          for p in apps/vscode apps/desktop apps/cli; do npm pkg set version="$V" --prefix "$p"; done

      - name: Typecheck and test
        run: |
          pnpm typecheck
          pnpm test

      - name: Build the VS Code extension
        run: pnpm vscode:vsix

      - name: Build the Windows installer
        run: pnpm desktop:dist

      - name: Pack the studio-check command
        run: pnpm cli:pack

      - name: Zip the skill and gather the installer script
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path skills/studio-files -DestinationPath release/studio-files-skill.zip -Force
          Copy-Item scripts/install-studio.ps1 release/
          Copy-Item apps/vscode/*.vsix, apps/desktop/out/*.exe, apps/cli/out/*.tgz release/
          Get-ChildItem release | ForEach-Object { "$($_.Name)  $([math]::Round($_.Length / 1MB, 1)) MB" }

      - name: Digest every file
        shell: pwsh
        run: |
          # LF line endings, so `sha256sum -c SHA256SUMS` reads it on every platform.
          $lines = Get-ChildItem release -File | Where-Object Name -ne SHA256SUMS | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          [IO.File]::WriteAllText((Join-Path (Get-Location) "release/SHA256SUMS"), (($lines -join "`n") + "`n"))
          Get-Content release/SHA256SUMS

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/studio-v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*

      - uses: actions/upload-artifact@v4
        with:
          name: studio-${{ github.ref_name }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

      - name: Release
        if: startsWith(github.ref, 'refs/tags/studio-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Studio ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
