packages:
  - "packages/*"
  - "apps/*"
  - "apps/*/frontend"
# Dependencies allowed to run their install scripts (Electron downloads its binary; esbuild verifies its
# own). pnpm 11 reads `allowBuilds`; `onlyBuiltDependencies` is the pnpm 10 spelling, kept for older installs.
allowBuilds:
  '@vscode/vsce-sign': false # the packager's optional signing helper: no install script runs, and nothing is signed
  electron: true
  esbuild: true
  workerd: set this to true or false
onlyBuiltDependencies:
  - electron
  - esbuild
