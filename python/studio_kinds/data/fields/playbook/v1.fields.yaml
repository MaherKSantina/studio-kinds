kind: playbook
version: 1
fields:
  - field: title
    type: string
    required: true
    description: The heading.
  - field: description
    type: string
    description: One line under the title.
  - field: view
    type: view
    description: Where the walk stands — written by a host that saves.
  - field: view.locks
    type: list of ref
    description: The answers taken, `decision=answer`.
  - field: view.history
    type: list of step
    description: The doors walked through, each with the answers before (`from`) and after (`locks`).
  - field: view.collapsed
    type: list of string
    description: Content panels folded shut, by file path.
  - field: decisions
    type: list of decision
    required: true
    description: The state space — questions, each with its answers.
  - field: decisions[].key
    type: string
    required: true
    description: Identity — appears in every `when`, `sets`, `by` and variant file name.
  - field: decisions[].label
    type: string
    required: true
    description: The question as shown.
  - field: decisions[].detail
    type: string
    description: One line under the question.
  - field: decisions[].values
    type: list of answer
    required: true
    description: The answers on offer.
  - field: decisions[].values[].key
    type: string
    required: true
    description: Identity of the answer.
  - field: decisions[].values[].label
    type: string
    required: true
    description: The answer as shown.
  - field: decisions[].values[].detail
    type: string
    description: One line under the answer.
  - field: decisions[].values[].activates
    type: list of decision key
    description: Decisions that exist only while this answer is taken.
  - field: decisions[].values[].when
    type: list of ref
    description: The answer is on offer only while every ref holds.
  - field: events
    type: list of event
    required: true
    description: What can happen, and the files each shows when taken.
  - field: events[].key
    type: string
    required: true
    description: Identity of the event.
  - field: events[].label
    type: string
    required: true
    description: The event as shown in the rail.
  - field: events[].trigger
    type: imposed | chosen
    description: "`imposed` arrives whether or not we are ready (default); `chosen` fires when we say so."
  - field: events[].arity
    type: once | many
    description: "`once` (default) is a move; `many` never leaves the table."
  - field: events[].rate
    type: string
    description: How often a `many` event fires.
  - field: events[].domain
    type: string
    description: A grouping heading in the rail.
  - field: events[].detail
    type: string
    description: One italic line shown when the event is open.
  - field: events[].inputs
    type: list of input
    description: What the event needs (chosen) or captures (imposed) — `input`, `from`, `why`.
  - field: events[].content
    type: list of entry
    description: The files the event shows, beside the book.
  - field: events[].content[].file
    type: path
    required: true
    description: A document beside the book, relative to the root book's folder.
  - field: events[].content[].label
    type: string
    description: The panel header.
  - field: events[].content[].by
    type: list of decision key
    description: The file is a base; the one shown is `<file>.variants/<decision=answer,...>.<ext>`, one per answer combination.
  - field: topics
    type: list of topic
    description: Content that is true while the assignment holds.
  - field: topics[].key
    type: string
    required: true
    description: Identity of the topic.
  - field: topics[].label
    type: string
    required: true
    description: The topic's heading.
  - field: topics[].when
    type: list of ref
    description: Live only while every ref holds; absent, always.
  - field: topics[].content
    type: list of entry
    required: true
    description: The files the topic shows, the same entries as an event's.
  - field: rules
    type: list of rule
    description: How each event plays out under a condition; the first matching rule wins.
  - field: rules[].event
    type: event key
    required: true
    description: The event the rule is about.
  - field: rules[].when
    type: list of ref
    description: The condition; absent, the general case.
  - field: rules[].status
    type: ready | gap | n/a
    description: "`ready` the response is known; `gap` none yet; `n/a` cannot arise here, hidden from the rail."
  - field: rules[].process
    type: markdown
    description: The response, or the prerequisite where `sets` is present.
  - field: rules[].sets
    type: list of ref
    description: Answers the event changes — makes it a door.
  - field: rules[].note
    type: string
    description: Free text.
  - field: rules[].every
    type: number
    description: Months between recurrences, once it applies.
  - field: rules[].from
    type: event key
    description: The event whose completion anchors the clock.
  - field: rules[].offset
    type: number
    description: Days after the anchor before the first occurrence is due.
