kind: jsonl
version: 1
fields:
  - field: (line)
    type: JSON object
    required: true
    description: One row per line; the columns are the union of the objects' keys in the order first seen. A whole file that is one JSON array of objects is accepted too.
  - field: $title
    type: string
    description: "Directive: the table's heading."
  - field: $description
    type: string
    description: "Directive: one line under the title."
  - field: $labels
    type: map of field → label
    description: "Directive: the header names, by field, dot paths included."
