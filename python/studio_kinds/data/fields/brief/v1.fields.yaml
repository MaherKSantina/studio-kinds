kind: brief
version: 1
fields:
  - field: title
    type: string
    required: true
    description: The heading of the brief.
  - field: description
    type: string
    description: "A one-line summary of the brief, read and kept on a dump. The viewer does not draw it: only a section's description is drawn."
  - field: sections
    type: list of section
    required: true
    description: The titled tree; each entry is a section.
  - field: sections[].title
    type: string
    required: true
    description: The section's heading; the tree shows it as a node.
  - field: sections[].description
    type: string
    description: One line about the section, drawn under its name in the content pane.
  - field: sections[].body
    type: markdown
    description: The section's prose, rendered as markdown.
  - field: sections[].content
    type: written document
    description: One document of another kind, written in the section — a mapping, not a list; drawn under the prose by its kind's viewer, checked by its kind's engine.
  - field: sections[].content.kind
    type: kind
    required: true
    description: Which engine renders the document — `playbook`, `kanban`, `guide`, `md`, any kind the Studio knows.
  - field: sections[].content.doc
    type: document
    required: true
    description: The document, as that kind's YAML parses it; a string for `md`.
  - field: sections[].children
    type: list of section
    description: Sections nested under this one, the same shape at any depth.
