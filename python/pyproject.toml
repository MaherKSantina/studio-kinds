[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studio-kinds"
version = "1.0.0"
description = "The Studio's document kinds — brief, playbook, kanban, calendar, policy, flow, jsonl, middleware, pipeline, collection, clip, song, md — checked from Python: the schemas, the books, the field tables, the templates, and the studio-check command."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]
keywords = ["studio", "yaml", "schema", "validation", "documents"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/MaherKSantina/studio-kinds"

[project.optional-dependencies]
schema = ["jsonschema>=4"]
test = ["pytest>=7", "jsonschema>=4"]

[project.scripts]
studio-check = "studio_kinds.cli:run"

[tool.setuptools.packages.find]
include = ["studio_kinds*"]

[tool.setuptools.package-data]
studio_kinds = ["data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
