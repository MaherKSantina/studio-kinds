kind: kanban
version: 1
fields:
  - field: title
    type: string
    required: true
    description: The board's heading.
  - field: description
    type: string
    description: One line under the title.
  - field: due
    type: date
    description: The day everything must be done by — the anchor backward scheduling chains from. `YYYY-MM-DD`, bare or quoted.
  - field: columns
    type: list of string | column
    required: true
    description: The statuses, in order; a string, or `{title, color?}` — `color` any CSS colour. A task's `status` must spell one of these.
  - field: tasks
    type: list of task
    required: true
    description: The cards; rows are derived from `needs`, never authored.
  - field: tasks[].key
    type: string
    required: true
    description: The stable key `needs` edges point at.
  - field: tasks[].title
    type: string
    required: true
    description: The card's heading.
  - field: tasks[].status
    type: column title
    description: The column, matched case-insensitively; unset lands in the first column, and a title that is no column is a problem to the checker.
  - field: tasks[].content
    type: written document
    description: One document of another kind, written into the task — a mapping, not a list; drawn in the card dialog by its kind's viewer, checked by its kind's engine.
  - field: tasks[].content.kind
    type: kind
    required: true
    description: Which engine renders the document — `brief`, `playbook`, `md`, any kind the Studio knows.
  - field: tasks[].content.doc
    type: document
    required: true
    description: The document, as that kind's YAML parses it; a string for `md`.
  - field: tasks[].note
    type: string
    description: One line under the title.
  - field: tasks[].body
    type: markdown
    description: The task's own prose — the dialog's main content.
  - field: tasks[].needs
    type: list of task key
    description: Prerequisites, each the `key` of another task in this board; the board layers tasks by longest chain. A key no task has, the task itself, or a cycle is a problem to the checker.
  - field: tasks[].duration
    type: number
    description: Calendar days the task takes (default 1) — weekends are days too; there is no holiday calendar.
  - field: tasks[].due
    type: date
    description: A per-task cap, tighter than the board's. `YYYY-MM-DD`, bare or quoted.
